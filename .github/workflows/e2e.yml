name: e2e
on:
  pull_request:
    paths: ["fe/**", "be/src/**", "contract/**", "e2e/**"]
permissions:
  contents: read
jobs:
  # Not a required check: a paths-filtered required check never reports on the PRs it skips and would block them.
  e2e:
    runs-on: ubuntu-latest # Docker is preinstalled: the e2e server starts its own Postgres with Testcontainers
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      # Until the journeys exist, there is nothing to run.
      - id: journeys
        run: |
          if ls e2e/*.e2e.test.ts >/dev/null 2>&1; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.journeys.outputs.present == 'true'
        run: bunx playwright-core install --with-deps chromium
      # One retry: a cold dev server or browser start can miss a wait once; a real break fails twice.
      - if: steps.journeys.outputs.present == 'true'
        working-directory: e2e
        run: bun test || bun test

name: ci
on:
  pull_request:
  push:
    branches: [master]
jobs:
  verify:
    runs-on: ubuntu-latest # Docker is preinstalled, so Testcontainers works
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run verify --scope all

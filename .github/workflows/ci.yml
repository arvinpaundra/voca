name: ci
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  verify: # branch protection requires this exact name
    runs-on: ubuntu-latest # Docker is preinstalled, so Testcontainers works
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }} # empty on a push to master
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # verify needs the merge-base with origin/master
          # The PR head, not GitHub's merge commit: the path guard measures the PR's own changes.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      # A task PR is one linked (GitHub's "closing issues": a closing keyword or the Development sidebar) to an issue
      # labelled `task`. It runs the path guard with the hash written on that issue's VERIFY line.
      # Ceiling: a PR not linked to its task issue skips the guard; the owner's review is the backstop.
      - name: verify
        run: |
          tasks=""
          if [ -n "${PR_NUMBER:-}" ]; then
            for i in $(gh pr view "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --json closingIssuesReferences -q '.closingIssuesReferences[].number'); do
              gh issue view "$i" -R "$GITHUB_REPOSITORY" --json labels -q '.labels[].name' | grep -qx task && tasks="$tasks $i"
            done
          fi
          set -- $tasks
          if [ $# -gt 1 ]; then
            echo "::error::PR is linked to several task issues ($tasks); a task PR closes exactly one"; exit 1
          elif [ $# -eq 1 ]; then
            hash=$(gh issue view "$1" -R "$GITHUB_REPOSITORY" --json body -q .body | grep -E '^VERIFY:' | grep -oE -- '--hash [0-9a-f]{8}' | grep -oE '[0-9a-f]{8}$' || true)
            [ -n "$hash" ] || { echo "::error::issue #$1 has no 8-hex --hash on its VERIFY line; the dispatcher must write it"; exit 1; }
            bun run verify --scope all --issue "$1" --hash "$hash"
          else
            bun run verify --scope all
          fi

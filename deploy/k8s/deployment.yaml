# IMAGE (an image digest) and RELEASE are replaced by the release workflow.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voca-api
  namespace: voca
spec:
  replicas: 1
  progressDeadlineSeconds: 180
  # The old pod serves until the new one is ready, so for a moment both run against the new schema:
  # every migration must still work with the previous release.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: voca-api
  template:
    metadata:
      labels:
        app: voca-api
      annotations:
        # Changes on every run, so a re-run with new secrets restarts the pod even on the same image.
        voca/release: "RELEASE"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: IMAGE
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: voca-api
          env:
            - name: LOG_LEVEL
              value: Info
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 8000
            periodSeconds: 20
            failureThreshold: 3
          # Leave the endpoints before SIGTERM, so Traefik stops sending requests to a pod that is shutting down.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

# Applied once by the owner with cluster-admin rights. The release itself can only touch the voca namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: voca
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: voca-deployer
  namespace: voca
---
apiVersion: v1
kind: Secret
metadata:
  name: voca-deployer-token
  namespace: voca
  annotations:
    kubernetes.io/service-account.name: voca-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: voca-deployer
  namespace: voca
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "services"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes", "middlewares"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: voca-deployer
  namespace: voca
subjects:
  - kind: ServiceAccount
    name: voca-deployer
    namespace: voca
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: voca-deployer

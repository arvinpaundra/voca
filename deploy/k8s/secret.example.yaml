# Shape only. The release workflow builds the real secret from GitHub repository secrets on every run.
apiVersion: v1
kind: Secret
metadata:
  name: voca-api
  namespace: voca
type: Opaque
stringData:
  DATABASE_URL: postgres://voca:<password>@postgres-postgresql.database.svc.cluster.local:5432/voca
  JWT_SECRET: <at least 32 random bytes>
  GOOGLE_CLIENT_ID: <client id>
  GOOGLE_CLIENT_SECRET: <client secret>

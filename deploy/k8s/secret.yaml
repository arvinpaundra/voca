# Filled in by the release from the GitHub secrets (envsubst); never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: voca-api
  namespace: voca
type: Opaque
stringData:
  DATABASE_URL: '${DATABASE_URL}'
  JWT_SECRET: '${JWT_SECRET}'
  GOOGLE_CLIENT_ID: '${GOOGLE_CLIENT_ID}'
  GOOGLE_CLIENT_SECRET: '${GOOGLE_CLIENT_SECRET}'

# Reached only by the Pages Function; browsers call voca.arvinpaundra.dev/api.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voca-api
  namespace: voca
  annotations:
    external-dns.alpha.kubernetes.io/hostname: voca-origin.arvinpaundra.dev
    external-dns.alpha.kubernetes.io/target: 140.245.111.204
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    traefik.ingress.kubernetes.io/router.middlewares: voca-ratelimit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: voca-origin.arvinpaundra.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: voca-api
                port:
                  number: 80
